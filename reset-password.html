<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set a new password | My Website V2.2</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="container" style="max-width:520px"><section class="panel" style="margin:30px 0;border-radius:16px"><p class="eyebrow">MY WEBSITE V2.2</p><h2>Set a new teacher password</h2><p>Open this page from the recovery link sent to your teacher email.</p><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm new password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="primary-btn" type="submit">Update password</button><p id="status" class="message" role="status"></p></form><p><a href="index.html">Return to login</a></p></section></main><script src="config.js"></script><script>
const cfg=window.APP_CONFIG;const status=document.getElementById("status");let client=null;
if(cfg&&cfg.SUPABASE_URL.startsWith("https://")&&!cfg.SUPABASE_URL.includes("PASTE_")&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_ANON_KEY.includes("PASTE_"))client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();if(!client){status.textContent="Configure Supabase in config.js first.";return;}const a=document.getElementById("newPassword").value,b=document.getElementById("confirmPassword").value;if(a.length<8){status.textContent="Password must be at least 8 characters.";return;}if(a!==b){status.textContent="Passwords do not match.";return;}const {error}=await client.auth.updateUser({password:a});if(error){status.textContent=error.message;return;}status.textContent="Password updated. You can now return to login.";});
</script></body></html>
